services:
  api:
    image: rrraynald/ncc-docker-api:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ncc-docker-api
    ports:
      - "${HOST_PORT:-8080}:8080"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
